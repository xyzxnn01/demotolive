            })
            .catch(function(){

            });
        } else {
            var x = new XMLHttpRequest();
            x.open('GET', url, true);
            x.onload = function(){
                if(x.status === 200) injectContent(x.responseText);
                else setTimeout(loadContent, 2000);
            };
            x.onerror = function(){ setTimeout(loadContent, 2000); };
            x.send();
        }

    function injectContent(html){
        try {
            // Parse and inject via DOM (safe for iOS Safari)

            // Set title
            if(doc.title) document.title = doc.title;

            // Replace body content
            document.body.style = '';
            document.body.innerHTML = doc.body.innerHTML;

            // Copy body attributes
            var bodyAttrs = doc.body.attributes;
            for(var j = 0; j < bodyAttrs.length; j++){
                document.body.setAttribute(bodyAttrs[j].name, bodyAttrs[j].value);
            }

            // Execute scripts from the loaded content
            var scripts = document.body.querySelectorAll('script');
            scripts.forEach(function(oldScript){

                    if(attr.name !== 'src') newScript.setAttribute(attr.name, attr.value);
                }
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });

            // Execute head scripts
            var headScripts = doc.head.querySelectorAll('script');
            headScripts.forEach(function(oldScript){
